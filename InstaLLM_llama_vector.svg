    <linearGradient id="cloakPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8146"/><stop offset="0.55" stop-color="#315331"/><stop offset="1" stop-color="#1c3524"/>
    </linearGradient>
    <linearGradient id="bladeBright" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#577d36"/><stop offset="0.65" stop-color="#8abf3f"/><stop offset="1" stop-color="#a9cf58"/>
    </linearGradient>
    <linearGradient id="bladeDark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#365d35"/><stop offset="1" stop-color="#6c9a48"/>
    </linearGradient>
    <clipPath id="tileClip">
