<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
  <title id="title">InstaLLM llama mascot eating grass</title>
  <desc id="desc">Smooth ivory llama in a side profile, chewing three green grass blades, set in a charcoal rounded square with a forest-green shoulder.</desc>
  <defs>
    <radialGradient id="bg" cx="51%" cy="48%" r="72%">
      <stop offset="0" stop-color="#0c0e0f"/><stop offset="0.66" stop-color="#101213"/><stop offset="1" stop-color="#191b1c"/>
    </radialGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0.84" y2="1">
      <stop offset="0" stop-color="#fffef8"/><stop offset="0.54" stop-color="#fcf9ef"/><stop offset="1" stop-color="#e8e6dc"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#fffcf3"/><stop offset="0.56" stop-color="#fffdf5"/><stop offset="1" stop-color="#edeade"/>
    </linearGradient>
    <linearGradient id="neck" x1="0.1" y1="0.3" x2="1" y2="0.94">
      <stop offset="0" stop-color="#d4d0bd"/><stop offset="0.33" stop-color="#efecdd"/><stop offset="0.72" stop-color="#fffdf3"/><stop offset="1" stop-color="#fffdf8"/>
    </linearGradient>
    <linearGradient id="underchin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bcb8a5"/><stop offset="0.66" stop-color="#e3e0d1"/><stop offset="1" stop-color="#f8f5e9"/>
    </linearGradient>
    <linearGradient id="cheekShade" x1="0" y1="0" x2="0.9" y2="0.8">
      <stop offset="0" stop-color="#d5d0c1"/><stop offset="1" stop-color="#f5f2e8"/>
    </linearGradient>
    <linearGradient id="earInside" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f412a"/><stop offset="0.6" stop-color="#345938"/><stop offset="1" stop-color="#25432b"/>
    </linearGradient>
    <linearGradient id="cloak" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#668e50"/><stop offset="0.36" stop-color="#3e673a"/><stop offset="0.76" stop-color="#28482c"/><stop offset="1" stop-color="#1a3322"/>
