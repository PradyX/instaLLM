<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compact bot settings</title>
<style>
html,body{margin:0;background:transparent}
*{box-sizing:border-box}
#bot-settings-preview{
  color-scheme:inherit;
  --sheet:light-dark(#ffffff,#1c201e);
  --ink:light-dark(#222925,#ecf0eb);
  --quiet:light-dark(#737c75,#9ca69f);
  --line:light-dark(#e8ece6,#323a34);
  --soft:light-dark(#f4f6f2,#262d27);
  --hover:light-dark(#f7f9f5,#242b25);
  --green:light-dark(#49663e,#bdd7ab);
  --green-soft:light-dark(#edf3e8,#2b3828);
  --red:light-dark(#b7413c,#ee918a);
  --red-soft:light-dark(#fbeeed,#402927);
  --sheet-radius:20px;
  --sheet-padding:28px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px;line-height:1.5;color:var(--ink);
  padding:12px 0 24px; width:100%;
}
#bot-settings-preview button,#bot-settings-preview input,#bot-settings-preview textarea{font:inherit}
#bot-settings-preview button{cursor:default;color:inherit}
#bot-settings-preview button:focus-visible,#bot-settings-preview input:focus-visible,#bot-settings-preview textarea:focus-visible{outline:2px solid var(--green);outline-offset:3px}
#bot-settings-preview [hidden]{display:none!important}
#bot-settings-preview .sheet{
  background:var(--sheet);width:min(100%,520px);margin:auto;
  border:1px solid var(--line);border-radius:var(--sheet-radius);
  padding:var(--sheet-padding);box-shadow:0 12px 36px light-dark(#2433220d,#00000025);
}
#bot-settings-preview .head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}
#bot-settings-preview h2{font-size:16px;font-weight:600;letter-spacing:-.25px;margin:0}
#bot-settings-preview .close{border:0;background:transparent;width:32px;height:32px;border-radius:8px;color:var(--quiet);font-size:25px;line-height:1;padding:0}
#bot-settings-preview .close:hover{background:var(--soft)}
#bot-settings-preview .profile{display:flex;align-items:center;gap:14px;padding-bottom:28px}
#bot-settings-preview .avatar{width:58px;height:58px;flex:none;display:grid;place-items:center}
#bot-settings-preview .avatar img{width:58px;height:58px;object-fit:contain}
#bot-settings-preview .identity{flex:1;min-width:0}
#bot-settings-preview .name{font-size:21px;letter-spacing:-.5px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0 0 4px}
#bot-settings-preview .text-action{border:0;background:transparent;color:var(--green);font-size:13px;font-weight:500;padding:2px 0;text-align:left}
#bot-settings-preview .text-action:hover{text-decoration:underline;text-underline-offset:3px}
#bot-settings-preview .edit{flex:none;border:0;border-radius:9px;background:var(--green-soft);color:var(--green);padding:9px 14px;font-weight:500;font-size:13px}
#bot-settings-preview .task-row{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:17px 0}
#bot-settings-preview .task-toggle{display:flex;align-items:center;gap:9px;flex:1;border:0;background:transparent;padding:0;text-align:left;font-weight:500}
#bot-settings-preview .count{font-size:12px;font-weight:400;color:var(--quiet)}
#bot-settings-preview .empty{color:var(--quiet);font-size:13px;padding:16px 0 0;margin:0}
#bot-settings-preview .manage{padding-top:22px}
#bot-settings-preview .section-label{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--quiet);font-weight:500;margin:0 0 6px}
#bot-settings-preview .action-row{display:flex;align-items:center;gap:14px;width:100%;border:0;background:transparent;border-radius:9px;padding:12px 10px;margin-left:-10px;width:calc(100% + 20px);text-align:left}
#bot-settings-preview .action-row:hover{background:var(--hover)}
#bot-settings-preview .action-text{flex:1;min-width:0}
#bot-settings-preview .action-title{display:block;font-size:14px;font-weight:500}
#bot-settings-preview .action-detail{display:block;font-size:12px;color:var(--quiet);margin-top:2px}
#bot-settings-preview .arrow{color:var(--quiet);font-size:21px;font-weight:400}
#bot-settings-preview .delete .action-title{color:var(--red)}
#bot-settings-preview .subhead{display:flex;align-items:center;gap:12px;margin-bottom:24px}
#bot-settings-preview .back{background:transparent;border:0;padding:4px 0;color:var(--quiet);font-size:14px}
#bot-settings-preview .field{display:block;margin-bottom:18px;font-size:12px;font-weight:500;color:var(--quiet)}
#bot-settings-preview input,#bot-settings-preview textarea{display:block;width:100%;margin-top:7px;border:1px solid var(--line);background:var(--soft);color:var(--ink);padding:11px 12px;border-radius:9px;font-size:14px;resize:vertical}
#bot-settings-preview .foot{display:flex;justify-content:flex-end;gap:10px;padding-top:14px}
#bot-settings-preview .secondary,#bot-settings-preview .primary,#bot-settings-preview .danger{padding:9px 15px;border:0;border-radius:9px;font-size:13px;font-weight:500;background:var(--soft)}
#bot-settings-preview .primary{background:var(--green-soft);color:var(--green)}
#bot-settings-preview .danger{background:var(--red-soft);color:var(--red)}
#bot-settings-preview .confirmation{font-size:14px;color:var(--quiet);margin:0 0 24px;max-width:36ch}
#bot-settings-preview .confirm-title{font-size:19px;margin:0 0 9px;font-weight:600;letter-spacing:-.35px}
#bot-settings-preview .portraits{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
#bot-settings-preview .portrait{padding:14px 8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--sheet);font-size:12px}
#bot-settings-preview .portrait:hover{background:var(--soft)}
#bot-settings-preview .portrait img{display:block;width:60px;height:60px;object-fit:contain;margin:0 auto 8px}
#bot-settings-preview .reopen{display:block;margin:40px auto;background:var(--green-soft);color:var(--green);border:0;border-radius:10px;padding:12px 18px}
#bot-settings-preview .task-placeholder{border:1px solid var(--line);border-radius:10px;padding:22px 18px;color:var(--quiet);font-size:13px}
@media(max-width:440px){
  #bot-settings-preview{padding-top:54px}
  #bot-settings-preview .sheet{padding:22px}
  #bot-settings-preview .profile{gap:10px}
  #bot-settings-preview .avatar,#bot-settings-preview .avatar img{width:48px;height:48px}
  #bot-settings-preview .name{font-size:18px}
  #bot-settings-preview .edit{padding:9px 11px}
  #bot-settings-preview input,#bot-settings-preview textarea{font-size:16px}
}
</style>
</head>
<body>
<main id="bot-settings-preview" aria-label="Compact bot settings mockup">
  <section class="sheet" aria-label="Bot settings">
    <div id="settings-view">
      <header class="head"><h2>Bot settings</h2><button class="close" type="button" aria-label="Close settings">×</button></header>
      <div class="profile">
        <div class="avatar"><img id="profile-picture" src="/Users/prady/Library/Application Support/com.prady.installm/profile_images/images/captain-quack.png" alt="Selected pet portrait"></div>
        <div class="identity"><h3 class="name" id="profile-name">Orchestrator</h3><button class="text-action" id="change-image" type="button">Change image</button></div>
        <button class="edit" type="button" id="edit-bot">Edit bot</button>
      </div>
      <div class="task-row">
        <button class="task-toggle" id="task-toggle" type="button" aria-expanded="false" aria-controls="task-empty">Linked tasks <span class="count">0</span></button>
        <button class="text-action" id="link-task" type="button">+ Link task</button>
      </div>
      <p class="empty" id="task-empty" hidden>No linked tasks yet.</p>
      <section class="manage" aria-label="Chat and bot management">
        <h3 class="section-label">Manage</h3>
        <button class="action-row" id="clear-chat" type="button"><span class="action-text"><span class="action-title">Clear chat</span><span class="action-detail">Remove messages. Keep this bot.</span></span><span class="arrow" aria-hidden="true">›</span></button>
        <button class="action-row delete" id="delete-bot" type="button"><span class="action-text"><span class="action-title">Delete bot</span><span class="action-detail">Your chat history is kept.</span></span><span class="arrow" aria-hidden="true">›</span></button>
      </section>
    </div>
    <form id="editor-view" hidden>
      <header class="subhead"><button class="back" type="button" data-back aria-label="Back to bot settings">‹ Back</button><h2>Edit bot</h2></header>
      <label class="field">Name<input id="bot-name-input" value="Orchestrator" maxlength="60" required></label>
      <label class="field">Soul<textarea rows="4">You are a helpful assistant.
Give clear, practical answers.
Ask for clarification when needed.</textarea></label>
      <footer class="foot"><button class="secondary" type="button" data-back>Cancel</button><button class="primary" type="submit">Save</button></footer>
    </form>
    <div id="portrait-view" hidden>
      <header class="subhead"><button class="back" type="button" data-back aria-label="Back to bot settings">‹ Back</button><h2>Saved portraits</h2></header>
      <div class="portraits">
        <button class="portrait" type="button"><img src="/Users/prady/Library/Application Support/com.prady.installm/profile_images/images/captain-quack.png" alt="">Current</button>
        <button class="portrait" type="button"><img src="/Users/prady/Library/Application Support/com.prady.installm/profile_images/images/boba.png" alt="">Boba</button>
        <button class="portrait" type="button"><img src="/Users/prady/Library/Application Support/com.prady.installm/profile_images/images/boxcat.png" alt="">Boxcat</button>
      </div>
    </div>
    <div id="tasks-view" hidden>
      <header class="subhead"><button class="back" type="button" data-back aria-label="Back to bot settings">‹ Back</button><h2>Link task</h2></header>
      <div class="task-placeholder">Choose an existing task from your board.</div>
      <footer class="foot"><button class="secondary" type="button" data-back>Back to settings</button></footer>
    </div>
    <div id="confirm-view" hidden>
      <h2 class="confirm-title" id="confirm-title">Clear chat?</h2>
      <p class="confirmation" id="confirm-description"></p>
      <footer class="foot"><button class="secondary" type="button" data-back>Cancel</button><button class="danger" type="button" id="confirm-action">Clear chat</button></footer>
    </div>
  </section>
  <button class="reopen" type="button" id="reopen" hidden>Bot settings</button>
</main>
<script>
(() => {
  const root = document.getElementById('bot-settings-preview');
  const sheet = root.querySelector('.sheet');
  const views = ['settings-view','editor-view','portrait-view','tasks-view','confirm-view'];
  function show(id) { views.forEach(view => root.querySelector('#' + view).hidden = view !== id); }
  root.querySelectorAll('[data-back]').forEach(button => button.addEventListener('click', () => show('settings-view')));
  root.querySelector('.close').addEventListener('click', () => { sheet.hidden = true; root.querySelector('#reopen').hidden = false; });
  root.querySelector('#reopen').addEventListener('click', () => { sheet.hidden = false; root.querySelector('#reopen').hidden = true; show('settings-view'); });
  root.querySelector('#edit-bot').addEventListener('click', () => show('editor-view'));
  root.querySelector('#editor-view').addEventListener('submit', event => { event.preventDefault(); root.querySelector('#profile-name').textContent = root.querySelector('#bot-name-input').value.trim() || 'Orchestrator'; show('settings-view'); });
  root.querySelector('#change-image').addEventListener('click', () => show('portrait-view'));
  root.querySelectorAll('.portrait').forEach(button => button.addEventListener('click', () => { root.querySelector('#profile-picture').src = button.querySelector('img').src; show('settings-view'); }));
  root.querySelector('#task-toggle').addEventListener('click', event => { const button = event.currentTarget; const expanded = button.getAttribute('aria-expanded') === 'true'; button.setAttribute('aria-expanded', String(!expanded)); root.querySelector('#task-empty').hidden = expanded; });
  root.querySelector('#link-task').addEventListener('click', () => show('tasks-view'));
  function confirm(kind) {
    const clear = kind === 'clear';
    root.querySelector('#confirm-title').textContent = clear ? 'Clear chat?' : 'Delete ' + root.querySelector('#profile-name').textContent + '?';
    root.querySelector('#confirm-description').textContent = clear ? 'This permanently removes the messages. Your bot, chat settings and linked tasks stay.' : 'This removes the bot from your list. Your messages and linked tasks stay available.';
    root.querySelector('#confirm-action').textContent = clear ? 'Clear chat' : 'Delete bot';
    show('confirm-view');
  }
  root.querySelector('#clear-chat').addEventListener('click', () => confirm('clear'));
  root.querySelector('#delete-bot').addEventListener('click', () => confirm('delete'));
  root.querySelector('#confirm-action').addEventListener('click', () => show('settings-view'));
  root.addEventListener('keydown', event => { if (event.key === 'Escape') show('settings-view'); });
  if (globalThis.Tweak) {
    const design = { radius: 20, padding: 28 };
    const tweak = new Tweak({ container: sheet, onChange: () => { root.style.setProperty('--sheet-radius', design.radius + 'px'); root.style.setProperty('--sheet-padding', design.padding + 'px'); } });
    tweak.addSlider(design, 'radius', {label:'Corner radius',min:12,max:28,unit:'px'});
    tweak.addSlider(design, 'padding', {label:'Spacing',min:20,max:32,unit:'px'});
  }
  window.addEventListener('load', () => {
    console.log('Layout check', JSON.stringify({ width:innerWidth, overflow:document.documentElement.scrollWidth > innerWidth, portraitLoaded:root.querySelector('#profile-picture').naturalWidth > 0 }));
  });
})();
</script>
</body>
</html>
