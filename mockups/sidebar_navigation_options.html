<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pocket LLM · Four sidebar directions</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    body { color: var(--foreground, #eee6ed); font: 14px/1.45 var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif); }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 2px solid #ffacd4; outline-offset: 3px; }
    .views { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin: 0 0 22px; }
    .views span { color: var(--muted-foreground, #a89ca6); font-size: 12px; margin-right: 4px; }
    .views button, .inspect { color: var(--foreground, #eee6ed); border: 1px solid var(--border, #453b43); background: transparent; padding: 6px 11px; border-radius: 8px; }
    .views button[aria-pressed="true"] { background: var(--accent-surface, #442737); border-color: var(--accent, #ffacd4); }
    .gallery { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 24px; }
    .gallery.focused { grid-template-columns: minmax(0, 440px); justify-content: center; }
    .concept[hidden] { display: none; }
    .concept-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .number { color: var(--muted-foreground, #a89ca6); font-size: 12px; font-weight: 650; }
    h2 { margin: 0; flex: 1; font-size: 16px; font-weight: 650; letter-spacing: -.3px; }
    .inspect { padding: 4px 8px; font-size: 13px; }
    .description { margin: 0 0 14px; min-height: 42px; color: var(--muted-foreground, #a89ca6); font-size: 12px; line-height: 1.6; }
    .recommend { color: #ffacd4; font-size: 10px; font-weight: 600; margin-left: 5px; }
    .mock { --ink: #eadfe7; --sub: #ac9da7; --pink: #ffacd4; --panel: #211b20; --soft: #30272e; --line: #40343d; --selected: #432a3b; color: var(--ink); background: var(--panel); border: 1px solid #46323e; border-radius: var(--radius, 16px); width: 100%; max-width: 320px; height: 720px; margin: 0 auto; padding: 18px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 12px 30px #00000020; }
    .mock button { color: inherit; border: 0; background: transparent; }
    .icon { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .logo { background: var(--pink); width: 34px; height: 34px; padding: 6px; border-radius: 11px; object-fit: contain; flex: none; }
    .brand-copy { flex: 1; min-width: 0; }
    .brand-copy strong { display: block; font-size: 15px; letter-spacing: -.2px; }
    .brand-copy small { color: var(--sub); font-size: 11px; }
    .icon-button { width: 32px; height: 32px; border-radius: 9px; display: inline-grid; place-items: center; padding: 0; flex: none; }
    .icon-button:hover { background: var(--soft); }
    .mock .icon-button.accent { color: #2e1825; background: var(--pink); }
    .shortcut-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; margin-bottom: 18px; }
    .mock .shortcut { background: #2c232a; border: 1px solid #43323e; border-radius: 11px; height: 65px; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 7px; padding: 6px 2px; font-size: 10.5px; color: #d4c3ce; }
    .shortcut .icon { color: var(--pink); width: 20px; height: 20px; }
    .search { display: flex; align-items: center; gap: 9px; height: 42px; padding: 5px 6px 5px 12px; background: var(--soft); border-radius: 11px; color: var(--sub); flex: none; margin-bottom: 20px; }
    .search .icon { width: 17px; height: 17px; }
    .search input { width: 100%; min-width: 0; flex: 1; border: 0; outline: 0; background: transparent; color: var(--ink); padding: 0; font-size: 12px; }
    .search input::placeholder { color: var(--sub); opacity: 1; }
    .search .icon-button { color: var(--pink); width: 29px; height: 29px; background: #ffffff08; }
    .section-title { display: flex; align-items: center; justify-content: space-between; margin: 0 0 9px; color: var(--sub); font-size: 10px; font-weight: 650; letter-spacing: .9px; text-transform: uppercase; }
    .section-title button { color: var(--pink); font-size: 10px; letter-spacing: 0; text-transform: none; padding: 2px 0; }
    .chat-list { display: grid; gap: 3px; }
    .mock .chat { text-align: left; display: flex; align-items: center; gap: 10px; padding: 10px 9px; border-radius: 9px; width: 100%; min-width: 0; }
    .chat .icon { width: 16px; height: 16px; color: var(--sub); }
    .mock .chat[hidden] { display: none; }
    .chat-copy { min-width: 0; flex: 1; }
    .chat-copy strong { display: block; font-size: 12px; font-weight: 450; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .chat-copy small { display: block; margin-top: 3px; font-size: 10px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mock .chat.active { background: var(--selected); color: var(--pink); }
    .chat.active .icon { color: var(--pink); }
    .compact .chat.active { box-shadow: inset 3px 0 var(--pink); }
    .compact .chat { padding-top: 10px; padding-bottom: 10px; }
    .roster { margin-top: 14px; }
    .roster .section-title { margin-bottom: 5px; }
    .roster-row { display: flex; align-items: center; gap: 9px; padding: 4px 8px; color: #d1c1cb; font-size: 11px; }
    .avatar { width: 24px; height: 24px; display: grid; place-items: center; background: #362831; border-radius: 8px; color: #dca4c0; }
    .avatar .icon { width: 14px; height: 14px; }
    .roster-row .count { margin-left: auto; font-size: 10px; color: var(--sub); }
    .footer { margin-top: auto; padding-top: 10px; }
    .nav-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 7px; border-radius: 8px; text-align: left; font-size: 12px; }
    .nav-row .icon { color: var(--sub); width: 17px; height: 17px; }
    .nav-row .count { margin-left: auto; color: var(--sub); font-size: 10px; }
    .mock .nav-row:hover, .mock .chat:not(.active):hover { background: #ffffff06; }
    .chat-first .brand { margin-bottom: 23px; }
    .chat-first .brand-copy strong { font-size: 17px; }
    .chat-first .search { background: transparent; border: 1px solid #5b4654; height: 42px; margin-bottom: 22px; }
    .chat-first .search .icon-button { background: var(--pink); color: #2e1825; }
    .chat-first .chat { padding: 10px 9px; }
    .chat-first .chat.active { background: #3a2633; }
    .chat-first .roster { margin-top: 16px; }
    .utility-dock { background: #2a2128; padding: 5px; border-radius: 11px; margin-top: 9px; }
    .utility-dock .nav-row { padding: 7px; font-size: 11px; }
    .dashboard .brand { margin-bottom: 13px; }
    .workspace-pill { display: flex; align-items: center; justify-content: space-between; background: #34262f !important; border-radius: 9px; padding: 10px 11px; font-size: 12px; margin-bottom: 12px; }
    .workspace-pill .icon { width: 14px; height: 14px; color: var(--pink); }
    .dashboard .utilities { margin-bottom: 15px; }
    .dashboard .utilities .nav-row { padding: 7px 3px; font-size: 12px; }
    .dashboard .utilities .nav-row .icon { color: #ceb3c2; }
    .dashboard .search { margin-bottom: 14px; }
    .tabs { display: flex; padding: 3px; background: #2e242b; border-radius: 9px; margin-bottom: 14px; }
    .mock .tabs button { flex: 1; padding: 6px 2px; font-size: 11px; border-radius: 7px; color: var(--sub); }
    .mock .tabs button[aria-selected="true"] { color: var(--pink); background: #48303f; }
    .dashboard .chat { padding: 9px 7px; }
    .tab-panel[hidden] { display: none; }
    .split { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 14px; padding: 16px; }
    .icon-rail { display: flex; align-items: center; flex-direction: column; gap: 13px; }
    .icon-rail .logo { width: 32px; height: 32px; padding: 5px; margin-bottom: 10px; }
    .icon-rail .icon-button { width: 34px; height: 34px; color: #c3aebb; }
    .icon-rail .icon-button.is-current { background: #513043; color: var(--pink); }
    .icon-rail .push-down { margin-top: auto; }
    .split-main { display: flex; flex-direction: column; min-width: 0; }
    .split .brand { margin: 4px 0 23px; gap: 4px; }
    .split .brand-copy strong { font-size: 15px; }
    .split .brand-copy small { font-size: 10px; }
    .split .search { padding-left: 9px; gap: 6px; height: 38px; margin-bottom: 23px; }
    .split .search input { font-size: 11px; }
    .split .search .icon-button { width: 25px; height: 25px; }
    .split .search > .icon { width: 15px; height: 15px; }
    .split .chat { padding: 11px 8px; gap: 8px; }
    .split .chat-copy strong { font-size: 11.5px; }
    .split .chat .icon { width: 14px; height: 14px; }
    .split .roster { margin-top: 23px; }
    .split .roster-row { padding: 7px 4px; }
    .split .workspace-hint { color: var(--sub); font-size: 10px; margin-top: auto; padding-top: 12px; }
    .note { font-size: 12px; line-height: 1.6; color: var(--muted-foreground, #a89ca6); margin: 22px 0 0; }
    @media (max-width: 610px) { .gallery { grid-template-columns: minmax(0, 1fr); gap: 28px; } .description { min-height: 0; } }
    @media (prefers-reduced-motion: no-preference) { .mock button { transition: background .12s ease; } }
  </style>
</head>

    const icon = name => `<svg class="icon" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
    const action = (name, label, extra = '') => `<button class="icon-button ${extra}" title="${label}" aria-label="${label}">${icon(name)}</button>`;
    const brand = (workspaceFirst = false) => `<div class="brand"><img class="logo" src="${logo}" alt=""><div class="brand-copy"><strong>${workspaceFirst ? 'My workspace' : 'Pocket LLM'}</strong><small>${workspaceFirst ? 'Pocket LLM' : 'My workspace'}</small></div>${action('chevron', 'Switch workspace')}</div>`;
    const search = (placeholder = 'Search chats') => `<div class="search">${icon('search')}<input type="search" placeholder="${placeholder}" aria-label="Search sample chats">${action('plus', 'New chat')}</div>`;
    const title = (text, link = 'See all') => `<div class="section-title"><span>${text}</span><button>${link}</button></div>`;
    const nav = (name, label, count = '') => `<button class="nav-row" title="${label}">${icon(name)}<span>${label}</span>${count ? `<span class="count">${count}</span>` : ''}</button>`;
    const utilities = () => nav('bot', 'Models') + nav('benchmark', 'Benchmark') + nav('settings', 'Settings');
    const chats = [
      ['Summarize the file', 'Notes and key takeaways'],
      ['Weekend plans', 'A few ideas for Saturday'],
      ['Dart async tips', 'Futures and streams explained'],
      ['Model comparison', 'Trying a smaller model']
    ];
    const chatList = (previews = false, count = 4) => `<div class="chat-list">${chats.slice(0, count).map(([name, preview], index) => `<button class="chat ${index === 0 ? 'active' : ''}" data-chat="${name.toLowerCase()}">${icon('chat')}<span class="chat-copy"><strong>${name}</strong>${previews ? `<small>${preview}</small>` : ''}</span></button>`).join('')}</div>`;
    const bots = () => `<div class="roster-row"><span class="avatar">${icon('bot')}</span>Researcher</div><div class="roster-row"><span class="avatar">${icon('bot')}</span>Planner</div>`;
    const room = () => `<div class="roster-row"><span class="avatar">${icon('room')}</span>Project room<span class="count">2 bots</span></div>`;
    const roster = () => `<div class="roster">${title('Bots', '+')}${bots()}</div><div class="roster">${title('Rooms', '+')}${room()}</div>`;
    const descriptions = [
      ['Compact shortcuts', 'Three small tool tiles replace the tall menu. A quiet chat list keeps the sidebar compact.'],
      ['Chat first', 'Search and conversations lead. Models, Benchmark and Settings live in a tidy dock at the bottom.'],
      ['Workspace dashboard', 'A clear workspace switcher, compact navigation and tabs for Chats, Bots and Rooms.'],
      ['Split icon rail', 'Tools get their own slim rail. The rest of the space belongs to conversations; best on desktop.']
    ];
    const concepts = [
      `<div class="mock compact">${brand()}<div class="shortcut-grid">${[['bot','Models'],['benchmark','Benchmark'],['settings','Settings']].map(([name,label]) => `<button class="shortcut">${icon(name)}<span>${label}</span></button>`).join('')}</div>${search()}${title('Chats')}${chatList(false,3)}${roster()}<div class="footer">${nav('board','Board','5 open')}</div></div>`,
      `<div class="mock chat-first">${brand(true)}${search()}${title('Recent chats')}${chatList(true,3)}<div class="roster">${title('Bots & rooms', '+')}<div class="roster-row"><span class="avatar">${icon('bot')}</span>Researcher<span class="count">Bot</span></div>${room()}</div><div class="footer">${nav('board','Board','5 open')}<div class="utility-dock">${utilities()}</div></div></div>`,
      `<div class="mock dashboard"><div class="brand"><img class="logo" src="${logo}" alt=""><div class="brand-copy"><strong>Pocket LLM</strong><small>Your local workspace</small></div></div><button class="workspace-pill">My workspace${icon('chevron')}</button><div class="utilities">${utilities()}</div>${search()}<div class="tabs" role="tablist" aria-label="Workspace conversations"><button role="tab" data-tab="chats" aria-selected="true">Chats</button><button role="tab" data-tab="bots" aria-selected="false">Bots</button><button role="tab" data-tab="rooms" aria-selected="false">Rooms</button></div><div class="tab-panel" data-panel="chats" role="tabpanel">${title('Recent', 'See all')}${chatList(true,3)}</div><div class="tab-panel" data-panel="bots" role="tabpanel" hidden>${title('Bots','+')}${bots()}</div><div class="tab-panel" data-panel="rooms" role="tabpanel" hidden>${title('Rooms','+')}${room()}</div><div class="footer">${nav('board','Board','5 open')}</div></div>`,
      `<div class="mock split"><div class="icon-rail"><img class="logo" src="${logo}" alt="Pocket LLM">${action('chat','Chats','is-current')}${action('bot','Models')}${action('benchmark','Benchmark')}${action('settings','Settings')}<div class="push-down">${action('board','Board')}</div></div><div class="split-main"><div class="brand"><div class="brand-copy"><strong>My workspace</strong><small>Pocket LLM</small></div>${action('chevron','Switch workspace')}</div>${search('Search chats')}${title('Chats')}${chatList()}${roster()}<div class="workspace-hint">My workspace · 5 open board tasks</div></div></div>`
    ];
    document.getElementById('gallery').innerHTML = concepts.map((html, index) => `<article class="concept" data-concept="${index + 1}"><div class="concept-head"><span class="number">0${index + 1}</span><h2>${descriptions[index][0]}${index === 0 ? '<span class="recommend">My pick</span>' : ''}</h2><button class="inspect" data-focus="${index + 1}" aria-label="Inspect option ${index + 1}" title="Inspect this option">↗</button></div><p class="description">${descriptions[index][1]}</p>${html}</article>`).join('');
    function view(id) {
      document.querySelectorAll('.concept').forEach(card => card.hidden = id !== 'all' && card.dataset.concept !== id);
      document.getElementById('gallery').classList.toggle('focused', id !== 'all');
      document.querySelectorAll('[data-view]').forEach(button => button.setAttribute('aria-pressed', button.dataset.view === id));
    }
    document.querySelectorAll('[data-view]').forEach(button => button.addEventListener('click', () => view(button.dataset.view)));
    document.querySelectorAll('[data-focus]').forEach(button => button.addEventListener('click', () => view(button.dataset.focus)));
    document.querySelectorAll('.mock').forEach(mock => {
      mock.querySelector('input').addEventListener('input', event => {
        const query = event.target.value.trim().toLowerCase();
        mock.querySelectorAll('[data-chat]').forEach(chat => chat.hidden = !chat.dataset.chat.includes(query));
      });
      mock.querySelectorAll('[data-chat]').forEach(chat => chat.addEventListener('click', () => {
        mock.querySelectorAll('[data-chat]').forEach(item => item.classList.toggle('active', item === chat));
      }));
      mock.querySelectorAll('[data-tab]').forEach(tab => tab.addEventListener('click', () => {
        mock.querySelectorAll('[data-tab]').forEach(item => item.setAttribute('aria-selected', item === tab));
        mock.querySelectorAll('[data-panel]').forEach(panel => panel.hidden = panel.dataset.panel !== tab.dataset.tab);
      }));
    });
    const overflow = [...document.querySelectorAll('.mock')].filter(mock => mock.scrollWidth > mock.clientWidth + 1 || mock.scrollHeight > mock.clientHeight + 1);
    console.log(JSON.stringify({ options: concepts.length, width: window.innerWidth, horizontalOverflow: document.documentElement.scrollWidth > window.innerWidth, overflowingPanels: overflow.length }));
