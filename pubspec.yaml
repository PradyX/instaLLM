name: installm
description: "Private AI. Fully on-device."
publish_to: 'none'
version: 1.6.0

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  dio: ^5.4.0
  go_router: ^18.1.1
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  intl: ^0.20.2
  flutter_dotenv: ^6.0.0
  pretty_dio_logger: ^1.4.0
  slang: ^4.13.0
  slang_flutter: ^4.13.0
  talker_flutter: ^5.1.15
  # Pinned by the section 17 checklist in the vault note "Architecture and
  # Runtime". macOS links the plugin's `llama.framework` through Swift Package
  # Manager and Android uses this repository's own three-ABI jniLibs (see the
  # `hooks` section below), so no platform here runs the package's bundled
  # Android AAR. The fork carries the llama.cpp pin and its artifacts, so this
  # app can move the runtime without waiting for a pub.dev release. Pinned to a
  # commit rather than a branch: the native libraries in android/ and ios/ are
  # built from exactly this pin, and a branch would let the Dart binding drift
  # from them. Bump the ref together with a native rebuild.
  llama_cpp_dart:
    git:
      url: https://github.com/PradyX/llama_cpp_dart.git
      ref: 0573bae438fbec2806f9d61c1174a5e2c7fff19c
  image_picker: ^1.1.2
  image: ^4.5.4
  path_provider: ^2.1.2
  path: ^1.9.0
  # Already present transitively; used directly for local journal edit detection.
  crypto: ^3.0.7
  flutter_local_notifications: ^22.3.2
  cupertino_icons: ^2.0.0
  flutter_markdown: ^0.7.3
  url_launcher: ^6.3.0
  file_selector: ^1.1.0
  # Text to speech, through the operating system's own synthesizer. `stts`
  # ships the Swift package Flutter needs on macOS and iOS, so no plugin here
  # falls back to CocoaPods, and its speech rate is a plain multiplier where
  # 1.0 is normal speed on every platform. See
  # lib/features/voice/data/platform_tts_service.dart.
  stts: ^1.3.4
  record: ^7.1.1
  syncfusion_flutter_pdf: ^35.1.41
  speech_to_text: ^7.5.0
  sherpa_onnx: ^2.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  # Device smoke tests that talk to real platform plugins. Run them with
  # `flutter test integration_test -d macos` (or another device).
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^4.0.9
  freezed: ^4.0.3
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

# The package ships an arm64-only Android AAR and extracts it through a
# native-assets build hook. This app builds llama.cpp for arm64-v8a,
# armeabi-v7a and x86_64 itself (scripts/build_llama_native_libs.sh), so the
# hook is deliberately switched off: bundling it would drop two ABIs and
# duplicate libraries for the third.
hooks:
  user_defines:
    llama_cpp_dart:
      bundle_android: false

flutter:
  uses-material-design: true

  assets:
    - .env
    - README.md
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/installm.png"
  remove_alpha_ios: true
  background_color_ios: "#101213"
  adaptive_icon_background: "#101213"
  adaptive_icon_foreground: "assets/icons/installm.png"
  adaptive_icon_foreground_inset: 16
  macos:
    generate: true
    image_path: "assets/icons/installm.png"
  windows:
    generate: true
    image_path: "assets/icons/installm.png"
    icon_size: 256
  web:
    generate: true
    image_path: "assets/icons/installm.png"
    background_color: "#101213"
    theme_color: "#101213"

flutter_native_splash:
  color: "#101213"
  image: "assets/icons/installm.png"
  android_12:
    color: "#101213"
    image: "assets/icons/installm.png"

slang:
  base_locale: en
  input_directory: lib/i18n
  input_file_pattern: .i18n.yaml
  output_directory: lib/i18n
  output_file_name: strings.g.dart
